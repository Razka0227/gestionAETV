services:
  db:
    image: postgres:16-alpine
    container_name: gestionaetv_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gestion
      POSTGRES_PASSWORD: gestion
      POSTGRES_DB: gestionaetv
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestion -d gestionaetv"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: